<div class="authwrap" id="auth" hidden>
  <div class="authcard">
    <div class="authbrand"><div class="logo">CG</div><div><h1>Cuartel General</h1><p class="muted">Tu oficina con un equipo de IA que trabaja por vos.</p></div></div>
    <div class="seg" id="authSeg"><button type="button" data-am="in" class="on">Entrar</button><button type="button" data-am="up">Crear cuenta</button></div>
    <form id="authForm" class="authform">
      <label data-up hidden>Tu nombre <input class="in" id="aName" autocomplete="name" maxlength="40"></label>
      <label id="emailWrap">Correo <input class="in" id="aEmail" type="email" autocomplete="email"></label>
      <label id="passWrap"><span id="passLbl">Contraseña</span> <input class="in" id="aPass" type="password" minlength="6" autocomplete="current-password"></label>
      <input type="hidden" id="aCode">
      <label class="terms" data-up hidden><input type="checkbox" id="aTerms"> <span>Leí y acepto los <a href="terminos.html" target="_blank" rel="noopener">términos y la política de privacidad</a></span></label>
      <button class="btn primary" id="aBtn">Entrar</button>
      <button type="button" class="linkbtn" id="forgotLink">¿Te olvidaste la contraseña?</button>
      <button type="button" class="linkbtn" id="backLink" hidden>← Volver a entrar</button>
      <p id="aMsg" class="amsg" aria-live="polite"></p>
    </form>
    <p class="muted authfoot">Creá tu cuenta gratis en un minuto · <a href="terminos.html" target="_blank" rel="noopener">Términos y privacidad</a></p>
  </div>
</div>
<div class="modal" id="upModal" hidden>
  <div class="card" style="width:min(460px,100%)"><div class="ochead"><h3>⭐ Mejorar a Pro</h3><button class="btn sm" data-close="upModal">Cerrar ✕</button></div><div id="upBody"></div></div>
</div>
<div class="modal" id="acct" hidden>
  <div class="card"><div class="ochead"><h3>👤 Mi cuenta</h3><button class="btn sm" data-close="acct">Cerrar ✕</button></div><div id="acctBody"></div></div>
</div>
